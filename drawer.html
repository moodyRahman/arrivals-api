<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Canvas</title>
  <style>
    body { margin: 0; background: #222; color: #ccc; font-family: sans-serif; display: grid; place-items: center; align-content: center; gap: 1rem; min-height: 100vh; }
    canvas { image-rendering: pixelated; width: min(95vw, 800px); background: #000; cursor: crosshair; touch-action: none; border: 1px solid #444; }
    #tools { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: center; }
    .swatch { width: 2rem; height: 2rem; border: 2px solid #555; border-radius: 4px; cursor: pointer; padding: 0; }
    .swatch.selected { border-color: #fff; }
    input[type=color] { width: 2.5rem; height: 2.5rem; border: none; background: none; padding: 0; cursor: pointer; }
    #status { font-size: .85rem; color: #888; min-height: 1.2em; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="tools">
    <input type="color" id="picker" value="#ffff00" title="Custom colour">
    <span id="swatches"></span>
    <button id="eraser">Eraser</button>
  </div>
  <div id="status"></div>
  <script>
    const SWATCHES = ["#ffffff", "#ff0000", "#ff8000", "#ffff00", "#00ff00", "#00ffff", "#0000ff", "#ff00ff"];
    const POLL_MS = 1000;   // how often to fetch what everyone else drew
    const FLUSH_MS = 100;   // how often to send our own strokes

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const picker = document.getElementById("picker");
    const statusEl = document.getElementById("status");

    let width = 0, height = 0;
    let color = picker.value;
    let drawing = false;
    let last = null;
    let pending = [];       // pixels drawn locally but not yet sent

    // ---- colour tools ----
    const swatchBox = document.getElementById("swatches");
    for (const c of SWATCHES) {
      const b = document.createElement("button");
      b.className = "swatch";
      b.style.background = c;
      b.onclick = () => setColor(c);
      swatchBox.append(b);
    }
    picker.oninput = () => setColor(picker.value);
    document.getElementById("eraser").onclick = () => setColor("#000000");

    function setColor(c) {
      color = c;
      picker.value = c;
      for (const b of swatchBox.children) {
        b.classList.toggle("selected", b.style.background && rgbToHex(b.style.background) === c);
      }
    }
    function rgbToHex(css) {
      const m = css.match(/\d+/g);
      return m ? "#" + m.slice(0, 3).map((n) => (+n).toString(16).padStart(2, "0")).join("") : css;
    }
    setColor(color);

    // ---- drawing ----
    function cellAt(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: Math.min(width - 1, Math.max(0, Math.floor(((e.clientX - r.left) / r.width) * width))),
        y: Math.min(height - 1, Math.max(0, Math.floor(((e.clientY - r.top) / r.height) * height))),
      };
    }

    function paint(x, y) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
      pending.push({ x, y, color });
    }

    // Bresenham, so fast mouse moves leave a solid line instead of dots
    function line(a, b) {
      let { x, y } = a;
      const dx = Math.abs(b.x - x), dy = -Math.abs(b.y - y);
      const sx = x < b.x ? 1 : -1, sy = y < b.y ? 1 : -1;
      let err = dx + dy;
      for (;;) {
        paint(x, y);
        if (x === b.x && y === b.y) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x += sx; }
        if (e2 <= dx) { err += dx; y += sy; }
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (!width) return;
      canvas.setPointerCapture(e.pointerId);
      drawing = true;
      last = cellAt(e);
      paint(last.x, last.y);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!drawing) return;
      const cell = cellAt(e);
      if (cell.x === last.x && cell.y === last.y) return;
      line(last, cell);
      last = cell;
    });
    const stop = () => { drawing = false; last = null; };
    canvas.addEventListener("pointerup", stop);
    canvas.addEventListener("pointercancel", stop);

    // ---- talking to the server ----
    async function flush() {
      if (!pending.length) return;
      const batch = pending;
      pending = [];
      try {
        const res = await fetch("/api/canvas", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pixels: batch }),
        });
        if (!res.ok) throw new Error(await res.text());
        statusEl.textContent = "";
      } catch (err) {
        pending = batch.concat(pending);  // try again next tick
        statusEl.textContent = "Couldn't save: " + err.message;
      }
    }

    async function refresh() {
      try {
        const res = await fetch("/api/canvas");
        const hex = await res.text();
        const w = +res.headers.get("X-Width"), h = +res.headers.get("X-Height");
        if (!res.ok || !w || !h) throw new Error(hex);

        if (w !== width || h !== height) {
          width = w; height = h;
          canvas.width = w; canvas.height = h;
        }
        // Don't overwrite strokes the server hasn't seen yet
        if (drawing || pending.length) return;

        const img = ctx.createImageData(width, height);
        for (let i = 0; i < width * height; i++) {
          img.data[i * 4] = parseInt(hex.substr(i * 6, 2), 16);
          img.data[i * 4 + 1] = parseInt(hex.substr(i * 6 + 2, 2), 16);
          img.data[i * 4 + 2] = parseInt(hex.substr(i * 6 + 4, 2), 16);
          img.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      } catch (err) {
        statusEl.textContent = "Couldn't load canvas: " + err.message;
      }
    }

    refresh();
    setInterval(refresh, POLL_MS);
    setInterval(flush, FLUSH_MS);
  </script>
</body>
</html>
